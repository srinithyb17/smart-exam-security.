services:
  - type: web
    name: smart-exam-portal
    env: node
    plan: free
    buildCommand: npm run install:all && npm run build && npm run seed
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
