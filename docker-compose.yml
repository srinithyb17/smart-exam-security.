version: '3.8'

services:
  smart-exam:
    build: .
    container_name: smart_exam_portal
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=smart_exam_super_secure_secret_key_2026_production
      - DB_PATH=/app/server/smart_exam.db
    volumes:
      - exam_data:/app/server/storage
      - exam_db:/app/server
    restart: unless-stopped

volumes:
  exam_data:
  exam_db:
